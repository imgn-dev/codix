[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/imgn-dev/codix"

[workspace.dependencies]
# `linux-tmpfs`: a tmpfs is local; without it sysinfo leaves tmpfs mounts out.
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
codix-core = { path = "crates/codix-core" }
codix-lang-go = { path = "crates/codix-lang-go" }
codix-lang-java = { path = "crates/codix-lang-java" }
codix-lang-python = { path = "crates/codix-lang-python" }
codix-lang-typescript = { path = "crates/codix-lang-typescript" }
codix-provider = { path = "crates/codix-provider" }
codix-testkit = { path = "crates/codix-testkit" }
codix-vcs-git = { path = "crates/codix-vcs-git" }
codix-vcs-hg = { path = "crates/codix-vcs-hg" }
codix-vcs-svn = { path = "crates/codix-vcs-svn" }
globset = "0.4.21"
ignore = "0.4.34"
inventory = "0.3.25"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
streaming-iterator = "0.1.9"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "linux-tmpfs"] }
tempfile = "3.27.0"
toml = "1.2.0"
toml_edit = "0.25.18"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-language = "0.1.9"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
