[workspace]
resolver = "3"
members = ["benches", "crates/*", "eval", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/imgn-dev/codix"

[workspace.dependencies]
# `linux-tmpfs`: a tmpfs is local; without it sysinfo leaves tmpfs mounts out.
blake3 = "1.8.7"
cc = "1.2.67"
clap = { version = "4.6.7", features = ["derive"] }
codix-build-gradle = { path = "crates/codix-build-gradle" }
codix-build-maven = { path = "crates/codix-build-maven" }
codix-core = { path = "crates/codix-core" }
codix-daemon = { path = "crates/codix-daemon" }
codix-mcp = { path = "crates/codix-mcp" }
codix-lang-c = { path = "crates/codix-lang-c" }
codix-lang-cpp = { path = "crates/codix-lang-cpp" }
codix-lang-csharp = { path = "crates/codix-lang-csharp" }
codix-lang-go = { path = "crates/codix-lang-go" }
codix-lang-java = { path = "crates/codix-lang-java" }
codix-lang-javascript = { path = "crates/codix-lang-javascript" }
codix-lang-json = { path = "crates/codix-lang-json" }
codix-lang-kotlin = { path = "crates/codix-lang-kotlin" }
codix-lang-markdown = { path = "crates/codix-lang-markdown" }
codix-lang-php = { path = "crates/codix-lang-php" }
codix-lang-python = { path = "crates/codix-lang-python" }
codix-lang-ruby = { path = "crates/codix-lang-ruby" }
codix-lang-rust = { path = "crates/codix-lang-rust" }
codix-lang-sql = { path = "crates/codix-lang-sql" }
codix-lang-toml = { path = "crates/codix-lang-toml" }
codix-lang-typescript = { path = "crates/codix-lang-typescript" }
codix-lang-xml = { path = "crates/codix-lang-xml" }
codix-lang-yaml = { path = "crates/codix-lang-yaml" }
codix-plugin = { path = "crates/codix-plugin" }
codix-provider = { path = "crates/codix-provider" }
codix-resolver = { path = "crates/codix-resolver" }
codix-resolve-java = { path = "crates/codix-resolve-java" }
codix-testkit = { path = "crates/codix-testkit" }
codix-vcs-git = { path = "crates/codix-vcs-git" }
codix-vcs-hg = { path = "crates/codix-vcs-hg" }
codix-vcs-svn = { path = "crates/codix-vcs-svn" }
globset = "0.4.21"
ignore = "0.4.34"
interprocess = "2.4.7"
libloading = "0.9.0"
inventory = "0.3.25"
notify = "8.2.1"
rayon = "1.12.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21.2"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
streaming-iterator = "0.1.9"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "linux-tmpfs"] }
tempfile = "3.27.0"
toml = "1.2.0"
toml_edit = "0.25.18"
tokio = { version = "1.54.1", features = ["rt", "io-std"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-language = "0.1.9"
tree-sitter-md = "0.5.4"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
xtask = { path = "xtask" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Smaller binaries at no measured cost in speed. `panic` stays `unwind`: a
# panic in one daemon connection must not end the daemon.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
