name = "python"
version = 1
id_prefix = "py"

[detect]
extensions = ["py", "pyi", "pyw"]
shebangs = ["python", "python3", "python2", "pypy", "pypy3"]
modelines = ["python"]

[symbols]
separator = "."
# `right`: an assignment's value is to a variable what a body is to a function.
body_fields = ["body", "right"]
# Python marks privacy by naming convention only.

# One namespace. Every scope is hoisted; methods do not see their class body.
[scopes]
hoisted = ["function", "class", "comprehension"]
self_receivers = ["self", "cls"]
hidden_from_functions = ["class"]

[names]
keywords = ["False", "None", "True", "and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "nonlocal", "not", "or", "pass", "raise", "return", "try", "while", "with", "yield"]
