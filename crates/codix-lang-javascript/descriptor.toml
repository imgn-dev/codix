name = "javascript"
version = 1
id_prefix = "js"

[detect]
extensions = ["js", "mjs", "cjs", "jsx"]
shebangs = ["node", "nodejs"]
modelines = ["javascript", "js"]

[symbols]
separator = "."
body_fields = ["body", "value"]

# Class members are reached through `this` or another object, never by a
# plain name.
[scopes]
hoisted = ["function", "class", "block"]
self_receivers = ["this"]
member_name_parents = ["member_expression", "pair", "field_definition"]

[scopes.namespaces]
method = "member"
constructor = "member"
field = "member"
property = "member"

[scopes.member_contexts]
call = ["member"]
read = ["member"]
write = ["member"]

# JavaScript names may hold `$`.
[names]
identifier = "^[\\p{XID_Start}_$][\\p{XID_Continue}$]*$"
keywords = ["break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do", "else", "enum", "export", "extends", "false", "finally", "for", "function", "if", "import", "in", "instanceof", "let", "new", "null", "return", "static", "super", "switch", "this", "throw", "true", "try", "typeof", "var", "void", "while", "with", "yield", "await", "implements", "interface", "package", "private", "protected", "public"]
