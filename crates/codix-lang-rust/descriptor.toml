name = "rust"
version = 1
id_prefix = "rs"

[detect]
extensions = ["rs"]
modelines = ["rust"]

[symbols]
separator = "::"
body_fields = ["body", "value"]
# `macro_rules!` has no body field.
body_tokens = ["{"]

[symbols.visibility]
node = "visibility_modifier"
values = ["pub"]

# Types and values are separate namespaces; methods, fields and associated
# items are reached through a value, `self`, `Self` or a path. Items are
# visible in their whole block, and a module sees only its own names.
[scopes]
hoisted = ["class", "type", "module"]
self_receivers = ["self", "Self"]
symbols_hoisted = true

[scopes.namespaces]
struct = "type"
enum = "type"
trait = "type"
interface = "type"
class = "type"
type_alias = "type"
type_parameter = "type"
module = "type"
macro = "macro"
method = "member"
field = "member"
enum_member = "member"

[scopes.contexts]
type = ["type", "value"]
call = ["value", "type"]

[scopes.member_contexts]
call = ["member"]
read = ["member"]
write = ["member"]

[scopes.closed]
module = ["value", "type"]

# A module declared without a body is the file named after it.
[names]
keywords = ["as", "async", "await", "break", "const", "continue", "crate", "dyn", "else", "enum", "extern", "false", "fn", "for", "gen", "if", "impl", "in", "let", "loop", "match", "mod", "move", "mut", "pub", "ref", "return", "self", "Self", "static", "struct", "super", "trait", "true", "type", "unsafe", "use", "where", "while", "abstract", "become", "box", "do", "final", "macro", "override", "priv", "typeof", "unsized", "virtual", "yield", "try"]
file_named_after = [{ kinds = ["module"], without_body = true }]

[generated]
paths = ["vendor/"]
