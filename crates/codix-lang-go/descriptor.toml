name = "go"
version = 1
id_prefix = "go"

[detect]
extensions = ["go"]
modelines = ["go"]

[symbols]
separator = "."
body_fields = ["body", "value"]
body_tokens = ["{"]
# Exported names are capitalized; Go has no visibility keywords.

# Types and values share one namespace per scope; fields and methods are
# reached only through a value, so no plain name reads them.
[scopes.namespaces]
field = "member"
method = "member"

# A capital first letter exports a name.
[names]
keywords = ["break", "case", "chan", "const", "continue", "default", "defer", "else", "fallthrough", "for", "func", "go", "goto", "if", "import", "interface", "map", "package", "range", "return", "select", "struct", "switch", "type", "var"]
visibility_by_case = true

[generated]
headers = ["^// Code generated .* DO NOT EDIT\\.$"]
paths = ["vendor/"]
