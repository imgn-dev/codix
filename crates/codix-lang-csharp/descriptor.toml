name = "csharp"
version = 1
id_prefix = "cs"

[detect]
extensions = ["cs", "csx"]
shebangs = ["dotnet-script"]
modelines = ["cs", "csharp"]

[symbols]
separator = "."
body_fields = ["body", "value", "accessors"]
# A field's initializer, which no field names.
body_tokens = ["="]

[symbols.visibility]
node = "modifier"
values = ["public", "protected", "private", "internal"]
