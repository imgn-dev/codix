name = "cpp"
version = 1
id_prefix = "cpp"

[detect]
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx"]
modelines = ["cpp", "c++"]

[symbols]
separator = "::"
body_fields = ["body", "value", "default_value"]
# Anonymous structs in a typedef come before the name.
body_tokens = ["{"]
# C++ visibility is set by `public:` sections, not on each member.

# Types are a namespace apart from values; class members are visible by
# name in their class's member functions, and through `this`.
[scopes]
hoisted = ["class", "type", "module"]
self_receivers = ["this"]

[scopes.namespaces]
class = "type"
struct = "type"
enum = "type"
type_alias = "type"
namespace = "type"
type_parameter = "type"
constructor = "constructor"

[scopes.contexts]
type = ["type", "value"]
read = ["value", "type"]
call = ["value", "type"]

[names]
keywords = ["auto", "break", "case", "char", "const", "continue", "default", "do", "double", "else", "enum", "extern", "float", "for", "goto", "if", "inline", "int", "long", "register", "restrict", "return", "short", "signed", "sizeof", "static", "struct", "switch", "typedef", "union", "unsigned", "void", "volatile", "while", "_Bool", "_Complex", "_Imaginary", "alignas", "alignof", "and", "asm", "bool", "catch", "char16_t", "char32_t", "char8_t", "class", "co_await", "co_return", "co_yield", "concept", "const_cast", "consteval", "constexpr", "constinit", "decltype", "delete", "dynamic_cast", "explicit", "export", "false", "friend", "mutable", "namespace", "new", "noexcept", "not", "nullptr", "operator", "or", "private", "protected", "public", "reinterpret_cast", "requires", "static_assert", "static_cast", "template", "this", "thread_local", "throw", "true", "try", "typeid", "typename", "using", "virtual", "wchar_t", "xor"]
overloading = true
constructors_named_after_type = true
