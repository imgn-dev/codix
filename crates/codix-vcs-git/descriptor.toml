name = "git"
# A directory in a plain clone; a file in worktrees and submodules.
detect = [".git"]
skip_dirs = [".git"]
honor_ignore_files = [".gitignore"]
# `.gitattributes` marks generated and vendored files for GitHub Linguist.
generated_attributes = ["linguist-generated", "linguist-vendored"]

[ignore]
strategy = "nested-file"
file = ".gitignore"
content = "*\n"
