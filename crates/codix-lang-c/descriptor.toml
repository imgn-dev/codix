name = "c"
version = 2
id_prefix = "c"

[detect]
extensions = ["c"]
modelines = ["c"]

[symbols]
separator = "."
body_fields = ["body", "value"]
# Anonymous structs in a typedef come before the name.
body_tokens = ["{"]

# Struct, union and enum tags are a namespace of their own; members are
# reached through a value only.
[scopes]
hoisted = ["class"]

[scopes.namespaces]
struct = "tag"
enum = "tag"
field = "member"

[scopes.contexts]
type = ["value", "tag"]

[names]
keywords = ["auto", "break", "case", "char", "const", "continue", "default", "do", "double", "else", "enum", "extern", "float", "for", "goto", "if", "inline", "int", "long", "register", "restrict", "return", "short", "signed", "sizeof", "static", "struct", "switch", "typedef", "union", "unsigned", "void", "volatile", "while", "_Bool", "_Complex", "_Imaginary"]
