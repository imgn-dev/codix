name = "typescript"
version = 1
id_prefix = "ts"

[detect]
extensions = ["ts", "mts", "cts"]
shebangs = ["deno", "ts-node", "tsx", "bun"]
modelines = ["typescript", "ts"]

[symbols]
separator = "."
body_fields = ["body", "value"]

[symbols.visibility]
node = "accessibility_modifier"
values = ["public", "protected", "private"]

# Interfaces, type aliases and type parameters are types only; classes and
# enums are values and types. Members are reached through `this` or another
# object, never by a plain name.
[scopes]
hoisted = ["function", "class", "block", "type"]
self_receivers = ["this"]
member_name_parents = ["member_expression", "pair", "public_field_definition"]

[scopes.namespaces]
interface = "type"
type_alias = "type"
type_parameter = "type"
method = "member"
constructor = "member"
field = "member"
property = "member"
enum_member = "member"

[scopes.contexts]
type = ["type", "value"]

[scopes.member_contexts]
call = ["member"]
read = ["member"]
write = ["member"]

# TypeScript names may hold `$`.
[names]
identifier = "^[\\p{XID_Start}_$][\\p{XID_Continue}$]*$"
keywords = ["break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do", "else", "enum", "export", "extends", "false", "finally", "for", "function", "if", "import", "in", "instanceof", "let", "new", "null", "return", "static", "super", "switch", "this", "throw", "true", "try", "typeof", "var", "void", "while", "with", "yield", "await", "implements", "interface", "package", "private", "protected", "public"]
type_keywords = ["any", "boolean", "never", "number", "object", "string", "symbol", "undefined", "unknown", "void"]
