name = "java"
version = 1
id_prefix = "java"

[detect]
extensions = ["java"]
modelines = ["java"]

[symbols]
separator = "."
# `value`: a field's initializer is to a field what a body is to a method.
body_fields = ["body", "value"]

[symbols.kinds]
record = "class"

[symbols.visibility]
node = "modifiers"
values = ["public", "protected", "private"]

# Types, methods and values are separate namespaces. A name read in an
# expression is a variable when one is in scope, else a type.
[scopes]
hoisted = ["class", "type"]
self_receivers = ["this"]

[scopes.namespaces]
class = "type"
interface = "type"
enum = "type"
type_parameter = "type"
method = "method"
constructor = "constructor"

[scopes.contexts]
call = ["method"]
type = ["type"]
import = ["type"]
read = ["value", "type"]

# Every class inherits the methods of `Object`.
[scopes.implicit_members]
method = ["clone", "equals", "finalize", "getClass", "hashCode", "notify", "notifyAll", "toString", "wait"]

# Java names may hold `$`. Public top-level types are named after their file.
[names]
identifier = "^[\\p{XID_Start}_$][\\p{XID_Continue}$]*$"
keywords = ["abstract", "assert", "boolean", "break", "byte", "case", "catch", "char", "class", "const", "continue", "default", "do", "double", "else", "enum", "extends", "final", "finally", "float", "for", "goto", "if", "implements", "import", "instanceof", "int", "interface", "long", "native", "new", "package", "private", "protected", "public", "return", "short", "static", "strictfp", "super", "switch", "synchronized", "this", "throw", "throws", "transient", "try", "void", "volatile", "while", "true", "false", "null", "_"]
type_keywords = ["var", "record", "yield", "sealed", "permits"]
overloading = true
constructors_named_after_type = true
file_named_after = [{ kinds = ["class", "interface", "enum"], visibility = "public", top_level = true }]
