[package]
name = "codix-cli"
description = "Headless code index for LLM agents: navigation and safe refactoring from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "codix"
path = "src/main.rs"

# Features are strictly additive: each one only adds a provider.
[features]
default = ["build-gradle", "build-maven", "lang-go", "lang-java", "vcs-git"]
full = ["default", "all-builds", "all-langs", "all-vcs"]
minimal = []
all-builds = ["build-gradle", "build-maven"]
all-langs = ["lang-c", "lang-cpp", "lang-csharp", "lang-go", "lang-java", "lang-javascript", "lang-json", "lang-kotlin", "lang-markdown", "lang-php", "lang-python", "lang-ruby", "lang-rust", "lang-sql", "lang-toml", "lang-typescript", "lang-xml", "lang-yaml"]
lang-go = ["dep:codix-lang-go"]
lang-typescript = ["dep:codix-lang-typescript"]
lang-python = ["dep:codix-lang-python"]
lang-kotlin = ["dep:codix-lang-kotlin"]
lang-javascript = ["dep:codix-lang-javascript"]
lang-rust = ["dep:codix-lang-rust"]
lang-c = ["dep:codix-lang-c"]
lang-cpp = ["dep:codix-lang-cpp"]
lang-csharp = ["dep:codix-lang-csharp"]
lang-php = ["dep:codix-lang-php"]
lang-ruby = ["dep:codix-lang-ruby"]
lang-json = ["dep:codix-lang-json"]
lang-yaml = ["dep:codix-lang-yaml"]
lang-toml = ["dep:codix-lang-toml"]
lang-xml = ["dep:codix-lang-xml"]
lang-markdown = ["dep:codix-lang-markdown"]
lang-sql = ["dep:codix-lang-sql"]
build-gradle = ["dep:codix-build-gradle"]
build-maven = ["dep:codix-build-maven"]
all-vcs = ["vcs-git", "vcs-hg", "vcs-svn"]
lang-java = ["dep:codix-lang-java"]
vcs-git = ["dep:codix-vcs-git"]
vcs-hg = ["dep:codix-vcs-hg"]
vcs-svn = ["dep:codix-vcs-svn"]

[dependencies]
clap.workspace = true
codix-build-gradle = { workspace = true, optional = true }
codix-build-maven = { workspace = true, optional = true }
codix-core.workspace = true
codix-daemon.workspace = true
codix-lang-java = { workspace = true, optional = true }
codix-lang-go = { workspace = true, optional = true }
codix-lang-typescript = { workspace = true, optional = true }
codix-lang-python = { workspace = true, optional = true }
codix-lang-kotlin = { workspace = true, optional = true }
codix-lang-javascript = { workspace = true, optional = true }
codix-lang-rust = { workspace = true, optional = true }
codix-lang-c = { workspace = true, optional = true }
codix-lang-cpp = { workspace = true, optional = true }
codix-lang-csharp = { workspace = true, optional = true }
codix-lang-php = { workspace = true, optional = true }
codix-lang-ruby = { workspace = true, optional = true }
codix-lang-json = { workspace = true, optional = true }
codix-lang-yaml = { workspace = true, optional = true }
codix-lang-toml = { workspace = true, optional = true }
codix-lang-xml = { workspace = true, optional = true }
codix-lang-markdown = { workspace = true, optional = true }
codix-lang-sql = { workspace = true, optional = true }
codix-provider.workspace = true
codix-vcs-git = { workspace = true, optional = true }
codix-vcs-hg = { workspace = true, optional = true }
codix-vcs-svn = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
codix-testkit.workspace = true

[lints]
workspace = true
